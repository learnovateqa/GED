<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Teacher portal · The GED Academy</title>
<meta name="theme-color" content="#DCEEF4">
<link rel="icon" href="../icons/academy.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/academy.css">
<style>
.top{background:var(--pink);border-bottom:1px solid #B9DAE5}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:62px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;margin-inline-end:auto;min-height:44px}
.logo img{width:38px;height:38px;border-radius:11px}
.logo b{display:block;line-height:1.1}.logo small{font-size:.78rem;color:var(--ink2)}
main{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
.field{display:block;margin:10px 0}.field span{display:block;font-weight:600;font-size:.9rem;margin-bottom:4px}
.field input,.bar2 select,.bar2 input{width:100%;min-height:46px;border:1.5px solid var(--line2);border-radius:12px;padding:0 12px;background:#fff}
.bar2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:12px 0;align-items:end}
.bar2 label span{display:block;font-size:.76rem;font-weight:600;margin-bottom:2px}
.scroll{overflow-x:auto;border:1.5px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:9px 12px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--blue);position:sticky;top:0;font-size:.78rem}
tbody tr.st{cursor:pointer}tbody tr.st:hover{background:var(--soft)}
td.det{white-space:normal;background:var(--soft);padding:14px}
.det h4{margin:10px 0 4px;font-size:.92rem}.det table{font-size:.84rem;background:#fff;border:1px solid var(--line)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:12px 0}
.err{color:var(--bad);font-weight:600}
.ptabs{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}
.tsess{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:8px 0}
.tsess.off{opacity:.6}
.ctimer{position:fixed;inset:0;z-index:300;background:var(--navy);color:#fff;display:grid;place-items:center;align-content:center;cursor:pointer;user-select:none}
.ctimer .ct{font-size:min(34vw,40vh);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.ctimer .cs{font-size:1.2rem;opacity:.85}
.ctimer.low{background:#B4530E}.ctimer.done{background:var(--bad)}
.ctimer .cx{position:absolute;top:16px;right:16px;background:#fff;color:var(--navy)}
.ptabs button{border:1.5px solid var(--line2);background:#fff;border-radius:999px;padding:8px 16px;min-height:44px;font-weight:600;cursor:pointer}
.ptabs button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.mtab td{vertical-align:middle}
.mi{width:100%;min-width:150px;min-height:40px;border:1.5px solid var(--line2);border-radius:10px;padding:0 10px;font:inherit}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:2px;font-size:1.05rem}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:12px;z-index:90}
.linkb{background:none;border:0;padding:0;font-weight:600;text-decoration:underline;cursor:pointer;color:var(--navy)}

/* ---------- sign-in: brand panel + form ---------- */
body.signin{background:radial-gradient(1200px 600px at 110% -10%,var(--rose) 0,transparent 60%),radial-gradient(900px 500px at -10% 110%,var(--pink) 0,transparent 55%),#fff;min-height:100vh}
body.signin .top{background:transparent;border-bottom:0}
.tlog{display:grid;grid-template-columns:1.1fr 1fr;gap:0;max-width:1000px;margin:4vh auto;border-radius:28px;overflow:hidden;box-shadow:0 24px 60px rgba(27,42,74,.16);background:#fff}
.tbrand{position:relative;background:linear-gradient(150deg,#0E9CC4 0%,#017A9C 55%,#1B2A4A 100%);color:#fff;padding:44px 40px;overflow:hidden}
.tbrand::after{content:"";position:absolute;right:-90px;bottom:-90px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.08)}
.tbrand::before{content:"";position:absolute;right:60px;top:-70px;width:160px;height:160px;border-radius:50%;background:rgba(248,223,227,.18)}
.tbrand .eyebrow{color:#DCEEF4}
.tbrand h1{font-size:clamp(1.7rem,3.4vw,2.4rem);margin:6px 0 10px;color:#fff}
.tlogo{width:68px;height:68px;border-radius:18px;box-shadow:0 8px 24px rgba(0,0,0,.25);margin-bottom:18px}
.tlede{color:#E6F3F8;font-size:1.02rem;max-width:34ch}
.tfeat{list-style:none;padding:0;margin:22px 0 0;display:grid;gap:12px;position:relative;z-index:1}
.tfeat li{display:flex;gap:12px;align-items:flex-start;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:10px 14px;font-size:.92rem;line-height:1.45}
.tfeat li>span{font-size:1.3rem;line-height:1.2}
.tdots{display:flex;gap:8px;margin-top:22px}.tdots i{width:12px;height:12px;border-radius:50%;background:#8DB4E2}.tdots i:nth-child(2){background:#8CCB9F}.tdots i:nth-child(3){background:#EDAE7E}.tdots i:nth-child(4){background:#E39AB6}
.tformwrap{display:grid;align-content:center;padding:40px}
.tform h2{font-size:1.6rem;margin:4px 0 14px}
.pwrow{display:flex;gap:8px}.pwrow input{flex:1}
.tnote{margin:14px 0 10px}
@media (max-width:760px){.tlog{grid-template-columns:1fr;margin:0 -16px;border-radius:0;box-shadow:none}.tbrand{padding:28px 22px}.tfeat{display:none}.tformwrap{padding:26px 22px}}

.pbanner{display:flex;gap:16px;align-items:flex-start;background:var(--pink);border:1.5px solid #B9DAE5;border-radius:22px;padding:20px 22px;margin:0 0 16px;position:relative;overflow:hidden}
.pbanner::after{content:"";position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.5)}
.pbanner h1{margin:2px 0 4px;font-size:clamp(1.7rem,5vw,2.4rem)}
.pbanner .pbsub{margin:0;color:#2E3B5C;max-width:60ch}
.pbanner>div{position:relative;z-index:1}
.pbic{flex:none;width:58px;height:58px;border-radius:16px;background:#fff;display:grid;place-items:center;font-size:1.8rem;box-shadow:0 6px 16px rgba(27,42,74,.08);position:relative;z-index:1}
.kp{position:relative}.kp>span{position:absolute;right:12px;top:10px;font-size:1.4rem}
.kp b{font-size:1.8rem}
table{border-radius:14px}
tbody tr:nth-child(even):not(.st+tr){background:var(--soft)}
.tsess{box-shadow:0 2px 8px rgba(27,42,74,.05)}
.foot .tm{font-size:.78rem;opacity:.85;margin-top:12px;flex-basis:100%}
.foot .fl{display:flex;flex-wrap:wrap;gap:6px 16px}.foot .fl a{display:inline-flex;align-items:center;min-height:44px}
body.signin .foot{margin-top:24px}
</style>
</head>
<body>
<header class="top"><div class="wrap">
 <a class="logo" href="../"><img src="../icons/academy.svg" alt=""><span><b>Teacher portal</b><small>The GED Academy · Ms. Maria</small></span></a>
 <button class="btn sm soft" id="out" type="button" hidden>Sign out</button>
</div></header>
<main id="main"></main>
<footer class="foot">
 <div class="wrap">
  <div><b style="font-size:1.1rem">The GED Academy</b><br><span class="small">Teacher portal · Elevate with Ms. Maria · Learnovate</span><br><span class="small">© 2026 Elevate with Ms. Maria · Learnovate Qatar</span></div>
  <nav class="small fl" aria-label="Footer"><a href="../">Website</a><a href="../rla/">Language Arts</a><a href="../social-studies/">Social Studies</a></nav>
  <p class="tm">GED® is a registered trademark. This site is not affiliated with or endorsed by GED Testing Service.</p>
 </div>
</footer>

<script src="../rla/config.js"></script>
<script>
(function () {
  const API = (window.CFG && CFG.API) || "", main = document.getElementById("main"), $ = s => document.querySelector(s);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const day = s => { const d = new Date(s); return isNaN(d) ? "" : d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }) + " " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }); };
  const SUBJ = ["RLA", "Social Studies"];
  let pw = "", D = null, open = "";
  try { pw = sessionStorage.getItem("ged-teacher") || ""; } catch (e) {}   /* kept only until this browser tab closes */
  const post = async body => (await fetch(API, { method: "POST", body: JSON.stringify(Object.assign({ password: pw }, body)) })).json();
  const MSG = { wrong: "This password is not correct.", locked: "Too many wrong tries. Wait 10 minutes and try again.", nopassword: "No teacher password is set yet. In your Google Sheet, use the menu GED Academy > Set teacher password." };

  function login(msg) {
    $("#out").hidden = true;
    if (!API) { main.innerHTML = `<div class="card t-gold" style="background:var(--c);max-width:560px;margin:6vh auto"><h1 style="font-size:1.4rem">The grade book is not connected yet</h1><p>The portal shows data from your Google Sheet. Follow the set-up steps in the README (section “Grade book”), then give the Web app URL to Claude.</p><a class="btn soft" href="../">Back to the site</a></div>`; return; }
    document.body.classList.add("signin");
    main.innerHTML = `<section class="tlog">
      <div class="tbrand">
        <img src="../icons/academy.svg" alt="" class="tlogo">
        <p class="eyebrow">The GED Academy · Teacher only</p>
        <h1>Welcome back, Ms. Maria</h1>
        <p class="tlede">Teach your sessions, follow every student and manage your class, all in one place.</p>
        <ul class="tfeat">
          <li><span>🎓</span><div><b>Teach</b><br>Present slides, show workbook and quiz answers, run a class timer.</div></li>
          <li><span>📊</span><div><b>Results</b><br>Sessions, workbooks, every quiz attempt with its error log, and mock tests.</div></li>
          <li><span>👤</span><div><b>Manage students</b><br>Add students, print access codes, give new codes, stop a student.</div></li>
        </ul>
        <div class="tdots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      </div>
      <div class="tformwrap"><div class="tform">
        <p class="eyebrow">🔒 Sign in</p><h2>Teacher portal</h2>
        <form id="f"><label class="field"><span>Password</span>
          <span class="pwrow"><input type="password" name="p" id="pw" required autocomplete="current-password"><button class="iconbtn" type="button" id="eye" aria-pressed="false" aria-label="Show password">👁️</button></span></label>
          <p class="err" role="alert" id="e">${esc(msg || "")}</p>
          <button class="btn primary" style="width:100%" type="submit">Sign in <span aria-hidden="true">→</span></button></form>
        <p class="small muted tnote">🔐 Your password is checked by your Google Sheet. It is never stored on this website. After 5 wrong tries, the portal waits 10 minutes.</p>
        <a class="small" href="../">← Back to The GED Academy</a>
      </div></div>
    </section>`;
    $("#eye").onclick = () => { const i = $("#pw"), on = i.type === "password"; i.type = on ? "text" : "password"; $("#eye").setAttribute("aria-pressed", on); $("#eye").setAttribute("aria-label", on ? "Hide password" : "Show password"); i.focus(); };
    $("#pw").focus();
    $("#f").onsubmit = async ev => { ev.preventDefault(); pw = ev.target.p.value; const b = ev.target.querySelector("button[type=submit]"); b.disabled = true; b.innerHTML = '<span class="wait">Checking…</span>'; await load(); };
  }
  async function load() {
    try {
      const r = await post({ action: "teacher" });
      if (!r.ok) { pw = ""; try { sessionStorage.removeItem("ged-teacher"); } catch (e) {} return login(MSG[r.error] || "Something went wrong. Please try again."); }
      try { sessionStorage.setItem("ged-teacher", pw); } catch (e) {}
      D = r; draw();
    } catch (e) { login("No internet, or the grade book did not answer."); }
  }
  const of = (list, code, subj) => list.filter(x => x.code === code && (!subj || x.subject === subj));
  const doneOf = (code, subj) => { const p = D.progress.find(x => x.code === code && x.subject === subj); return p ? Number(p.done) || 0 : 0; };
  const best = xs => xs.length ? xs.reduce((a, b) => (b.score / b.total > a.score / a.total ? b : a)) : null;

  let view = location.hash === "#teach" ? "teach" : "results";
  function draw() {
    $("#out").hidden = false; document.body.classList.remove("signin");
    const tabs = `<nav class="ptabs" aria-label="Teacher portal"><button type="button" data-v="teach" aria-pressed="${view === "teach"}">🎓 Teach</button><button type="button" data-v="results" aria-pressed="${view === "results"}">📊 Results</button><button type="button" data-v="manage" aria-pressed="${view === "manage"}">👤 Manage students</button></nav>`;
    const hello = () => { const h = new Date().getHours(); return h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening"; };
    const today = new Date().toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" });
    window.__pb = (icon, title, sub) => `<section class="pbanner"><span class="pbic" aria-hidden="true">${icon}</span><div><p class="eyebrow">${esc(hello())}, Ms. Maria · ${esc(today)}</p><h1>${esc(title)}</h1><p class="pbsub">${sub}</p></div></section>`;
    if (view === "manage") { manage(tabs); return; }
    if (view === "teach") { teach(tabs); return; }
    main.innerHTML = `${tabs}${__pb("📊", "Results", "Every student's sessions, workbooks, quiz attempts with error logs, and mock tests. Tap a student to see the details.")}
      <div class="kpi">
        <div class="pillar t-blue kp"><span aria-hidden="true">👥</span><small>STUDENTS</small><b>${D.students.filter(s => s.active).length}</b></div>
        <div class="pillar t-green kp"><span aria-hidden="true">✏️</span><small>WORKBOOKS SUBMITTED</small><b>${D.workbooks.length}</b></div>
        <div class="pillar t-peach kp"><span aria-hidden="true">📝</span><small>QUIZ ATTEMPTS</small><b>${D.quizzes.length}</b></div>
        <div class="pillar t-lav kp"><span aria-hidden="true">⏱️</span><small>MOCK TESTS</small><b>${D.mocks.length}</b></div>
      </div>
      <div class="bar2">
        <label><span>Subject</span><select id="s"><option value="">Both subjects</option>${SUBJ.map(g => `<option>${esc(g)}</option>`).join("")}</select></label>
        <label><span>Find a student</span><input id="q" type="search" placeholder="Name or code"></label>
        <button class="btn primary" type="button" id="xs">Export summary</button>
        <button class="btn" type="button" id="xa">Export all results</button>
      </div>
      <div class="scroll"><table><thead id="th"></thead><tbody id="tb"></tbody></table></div>
      <p class="small muted" style="margin-top:8px">Tap a student to see every workbook, quiz attempt and mock test. The export files open in Excel or Google Sheets.</p>
      <div class="sh"><span class="no">+</span><h2>Quiz answer keys</h2></div>
      <p>Keys loaded in the grade book: <b>${D.keys.length ? esc(D.keys.join(", ")) : "none yet"}</b>. Students cannot take a quiz until its key is loaded.</p>
      <label class="btn soft" style="cursor:pointer">Import quiz answer keys (quiz-keys.json)<input type="file" id="kf" accept=".json,application/json" hidden></label> <span id="km" role="status"></span>
      <p class="small muted" style="margin-top:8px">To add students, give new codes or stop a student, open <b>Manage students</b> above.</p>`;
    tabsWire();
    ["s", "q"].forEach(id => $("#" + id).oninput = rows);
    $("#xs").onclick = () => csv("ged-summary", summary());
    $("#xa").onclick = () => csv("ged-all-results", all());
    $("#kf").onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      try { const keys = JSON.parse(await f.text()); $("#km").textContent = "Saving…"; const r = await post({ action: "keys", keys }); if (!r.ok) throw 0; await load(); alert(r.saved + " answer key(s) saved in the grade book."); }
      catch (err) { $("#km").textContent = "This file did not work. Choose quiz-keys.json."; }
    };
    rows();
  }
  /* ---------- teach: open any session as the teacher (no sign-in, nothing saved), and a class timer ---------- */
  const SUBJECTS_T = [["rla", "Reasoning Through Language Arts"], ["social-studies", "Social Studies"]];
  let tSubj = "rla"; const COURSES = {};
  async function course(dir) {
    if (!COURSES[dir]) { const txt = await (await fetch("../" + dir + "/data.js", { cache: "no-cache" })).text(); COURSES[dir] = new Function("var window={};" + txt + ";return window.COURSE;")(); }
    return COURSES[dir];
  }
  async function teach(tabs) {
    main.innerHTML = `${tabs}${__pb("🎓", "Teach", "Open any session to teach it: present the slides, go through the reviewer, show the answers, and time activities. Nothing you do here is saved as student work.")}
      <div class="ptabs" role="group" aria-label="Subject">${SUBJECTS_T.map(s => `<button type="button" data-s="${s[0]}" aria-pressed="${tSubj === s[0]}">${esc(s[1])}</button>`).join("")}</div>
      <div id="tList"><p class="wait">Loading sessions…</p></div>
      <div class="sh"><span class="no">⏱</span><h2>Class timer</h2></div>
      <div class="card t-gold" style="background:var(--c)"><div class="row">${[1, 3, 5, 10, 15, 20, 45].map(m => `<button class="btn sm" type="button" data-m="${m}">${m} min</button>`).join("")}</div>
      <p class="small" style="margin:8px 0 0">The timer opens full screen. Tap it to pause. Press ✕ to close.</p></div>`;
    tabsWire();
    main.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { tSubj = b.dataset.s; teach(tabs); });
    main.querySelectorAll("[data-m]").forEach(b => b.onclick = () => timer(+b.dataset.m));
    try {
      const C = await course(tSubj), ready = C.ready || [];
      $("#tList").innerHTML = C.sessions.map(s => {
        const ok = ready.includes(s.n), base = `../${tSubj}/#/session/${s.n}`;
        return `<div class="card tsess ${ok ? "" : "off"}"><div><b>Session ${s.n} · ${esc(s.title)}</b><br><span class="small muted">${esc(s.sub || "")}</span></div>
          ${ok ? `<div class="row"><a class="btn sm primary" href="${base}/present">🖥️ Present slides</a><a class="btn sm" href="${base}/reviewer">📖 Reviewer</a><a class="btn sm" href="${base}/workbook">✏️ Workbook + answers</a><a class="btn sm" href="${base}/quiz">📝 Quiz + answers</a></div>` : `<span class="small muted">Not built yet</span>`}</div>`;
      }).join("");
    } catch (e) { $("#tList").innerHTML = `<p class="err">The sessions did not load. Check your internet.</p>`; }
  }
  function timer(mins) {
    let left = mins * 60, run = true, last = Date.now();
    const el = document.createElement("div"); el.className = "ctimer"; el.setAttribute("role", "timer");
    el.innerHTML = `<button class="iconbtn cx" type="button" aria-label="Close timer">✕</button><div class="ct" aria-live="off"></div><p class="cs">Tap to pause</p>`;
    document.body.appendChild(el);
    const draw = () => { el.querySelector(".ct").textContent = Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0"); el.classList.toggle("low", left <= 60); el.classList.toggle("done", left === 0); el.querySelector(".cs").textContent = left === 0 ? "Time is up" : run ? "Tap to pause" : "Paused · tap to continue"; };
    const iv = setInterval(() => { if (run && left > 0) { const now = Date.now(); if (now - last >= 1000) { left = Math.max(0, left - Math.round((now - last) / 1000)); last = now; draw(); } } else last = Date.now(); }, 200);
    el.onclick = e => { if (e.target.closest(".cx")) { clearInterval(iv); el.remove(); try { document.exitFullscreen && document.fullscreenElement && document.exitFullscreen(); } catch (x) {} return; } run = !run; last = Date.now(); draw(); };
    try { el.requestFullscreen && el.requestFullscreen().catch(() => {}); } catch (x) {}
    draw();
  }
  function tabsWire() { main.querySelectorAll(".ptabs [data-v]").forEach(b => b.onclick = () => { view = b.dataset.v; draw(); }); }
  /* ---------- manage students: add (codes are made by the grade book), edit, new code, stop ---------- */
  let justAdded = [], showStopped = false;
  async function save(body, btn, okMsg) {
    if (btn) { btn.disabled = true; btn.dataset.t = btn.textContent; btn.innerHTML = '<span class="wait">Saving…</span>'; }
    try { const r = await post(Object.assign({ action: "students" }, body)); if (!r.ok) throw new Error(r.error); if (r.added && r.added.length) justAdded = r.added; await load(); if (okMsg) toastT(okMsg); }
    catch (e) { if (btn) { btn.disabled = false; btn.textContent = btn.dataset.t; } alert(MSG[e.message] || "It did not save. Check your internet and try again."); }
  }
  function toastT(m) { const el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); el.textContent = m; document.body.appendChild(el); setTimeout(() => el.remove(), 3000); }
  function codeSheet(list) {
    return `<div class="scroll"><table><thead><tr><th>Name</th><th>Access code</th></tr></thead><tbody>${list.map(s => `<tr><td>${esc(s.name)}</td><td><b class="code">${esc(s.code)}</b></td></tr>`).join("")}</tbody></table></div>`;
  }
  function printCodes(list) {
    const w = window.open("", "_blank"); if (!w) { alert("Please allow pop-ups to print."); return; }
    w.document.write(`<!doctype html><meta charset="utf-8"><title>Access codes</title><style>body{font-family:Arial,sans-serif;padding:24px}div{border:1.5px dashed #999;border-radius:10px;padding:14px 18px;margin:0 0 12px;break-inside:avoid}b{font-size:22px;letter-spacing:3px}</style>` +
      list.map(s => `<div>${esc(s.name)}<br>The GED Academy · your access code: <b>${esc(s.code)}</b><br><small>https://learnovateqa.github.io/GED/ · sign in with this code and your full name.</small></div>`).join(""));
    w.document.close(); w.focus(); w.print();
  }
  function manage(tabs) {
    const list = D.students.filter(s => showStopped || s.active).sort((a, b) => String(a.name).localeCompare(String(b.name)));
    main.innerHTML = `${tabs}${__pb("👤", "Manage students", "Add students and print their access codes, fix names, give a new code, or stop a student. Their results always stay.")}
      <div class="card t-blue" style="background:var(--c)"><h3>Add students</h3>
        <p class="small">Type one full name per line. Each student gets an access code automatically.</p>
        <textarea id="newNames" rows="5" style="width:100%;border:1.5px solid var(--line2);border-radius:12px;padding:10px;font:inherit" placeholder="Amina Hassan&#10;Ravi Kumar"></textarea>
        <button class="btn primary" type="button" id="addBtn" style="margin-top:8px">Add students</button></div>
      ${justAdded.length ? `<div class="card t-green" style="background:var(--c);margin-top:14px"><h3>✓ New students and their codes</h3><p class="small">Give each student their own code. They sign in with it and their full name.</p>${codeSheet(justAdded)}
        <div class="row" style="margin-top:10px"><button class="btn sm" type="button" id="prNew">Print code cards</button><button class="btn sm soft" type="button" id="csvNew">Download list</button><button class="btn sm soft" type="button" id="hideNew">Done</button></div></div>` : ""}
      <div class="sh"><span class="no">${D.students.filter(s => s.active).length}</span><h2>Your students</h2></div>
      <label class="small" style="display:flex;gap:8px;align-items:center;margin-bottom:8px"><input type="checkbox" id="showStop" ${showStopped ? "checked" : ""}> Show stopped students too</label>
      <div class="scroll"><table class="mtab"><thead><tr><th>Name</th><th>Access code</th><th>Active</th><th>Notes (only you see these)</th><th></th></tr></thead><tbody>
        ${list.length ? list.map(s => `<tr data-c="${esc(s.code)}"><td><input class="mi" data-f="name" value="${esc(s.name)}" aria-label="Name"></td>
          <td><b class="code">${esc(s.code)}</b><br><button class="linkb small" type="button" data-new>Give a new code</button></td>
          <td><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-f="active" ${s.active ? "checked" : ""}> ${s.active ? "yes" : "stopped"}</label></td>
          <td><input class="mi" data-f="notes" value="${esc(s.notes || "")}" aria-label="Notes"></td>
          <td><button class="btn sm" type="button" data-save>Save</button></td></tr>`).join("") : `<tr><td colspan="5">No students yet. Add them above.</td></tr>`}
      </tbody></table></div>
      <div class="row" style="margin-top:10px"><button class="btn sm soft" type="button" id="prAll">Print code cards for all active students</button><button class="btn sm soft" type="button" id="csvAll">Download all codes</button></div>
      <p class="small muted" style="margin-top:10px">“Stopped” students cannot sign in, but their results stay. A new code replaces the old one at once; the student keeps all their work.</p>`;
    tabsWire();
    $("#addBtn").onclick = () => { const names = $("#newNames").value.split(/\n+/).map(x => x.trim().replace(/\s+/g, " ")).filter(Boolean); if (!names.length) { alert("Type at least one name."); return; } save({ add: names.map(name => ({ name })) }, $("#addBtn"), names.length + " student(s) added."); };
    if (justAdded.length) { $("#prNew").onclick = () => printCodes(justAdded); $("#csvNew").onclick = () => csv("ged-new-codes", [["Name", "Access code"], ...justAdded.map(s => [s.name, s.code])]); $("#hideNew").onclick = () => { justAdded = []; manage(tabs); }; }
    $("#showStop").onchange = e => { showStopped = e.target.checked; manage(tabs); };
    const act = D.students.filter(s => s.active);
    $("#prAll").onclick = () => printCodes(act); $("#csvAll").onclick = () => csv("ged-all-codes", [["Name", "Access code"], ...act.map(s => [s.name, s.code])]);
    main.querySelectorAll("tr[data-c]").forEach(tr => {
      const code = tr.dataset.c, f = k => tr.querySelector(`[data-f="${k}"]`);
      tr.querySelector("[data-save]").onclick = e => save({ update: [{ code, name: f("name").value, notes: f("notes").value, active: f("active").checked }] }, e.target, "Saved.");
      tr.querySelector("[data-new]").onclick = e => { if (confirm("Give " + f("name").value + " a new code? The old code stops working at once.")) save({ update: [{ code, newCode: true }] }, null, "New code made. Find it in the list."); };
    });
  }
  function filtered() {
    const q = $("#q").value.trim().toLowerCase();
    return D.students.filter(s => !q || (s.name + " " + s.code + " " + s.typed).toLowerCase().includes(q));
  }
  function rows() {
    const subj = $("#s").value, S = subj ? [subj] : SUBJ;
    $("#th").innerHTML = `<tr><th>Student</th>${S.map(x => `<th>${esc(x)}<br>sessions done</th><th>${esc(x)}<br>workbooks</th><th>${esc(x)}<br>quiz attempts</th><th>${esc(x)}<br>mock tests</th>`).join("")}<th>Last sign-in</th></tr>`;
    const list = filtered();
    $("#tb").innerHTML = list.length ? list.map(s => {
      const cells = S.map(x => { const m = best(of(D.mocks, s.code, x)); return `<td><b>${doneOf(s.code, x)}</b> / 12</td><td>${of(D.workbooks, s.code, x).length}</td><td>${of(D.quizzes, s.code, x).length}</td><td>${m ? m.score + "/" + m.total : "–"}</td>`; }).join("");
      return `<tr class="st" data-c="${esc(s.code)}" tabindex="0"><td><b>${esc(s.name || s.typed)}</b>${s.active ? "" : " (not active)"}<br><span class="small muted">${esc(s.code)}</span></td>${cells}<td>${esc(day(s.last))}</td></tr>${open === s.code ? `<tr><td class="det" colspan="${2 + S.length * 4}">${detail(s, S)}</td></tr>` : ""}`;
    }).join("") : `<tr><td colspan="12">No students yet. Open <b>Manage students</b> to add them.</td></tr>`;
    document.querySelectorAll("tr.st").forEach(tr => { const go = () => { open = open === tr.dataset.c ? "" : tr.dataset.c; rows(); }; tr.onclick = go; tr.onkeydown = e => { if (e.key === "Enter") go(); }; });
  }
  function detail(s, S) {
    const T = (head, body) => body.length ? `<div class="scroll"><table><thead><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${body.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>` : `<p class="small muted">Nothing yet.</p>`;
    return S.map(x => {
      const p = D.progress.find(y => y.code === s.code && y.subject === x), st = (p && p.state && p.state.s) || {};
      const done = Object.keys(st).filter(n => st[n].badge).sort((a, b) => a - b);
      return `<h3>${esc(x)}</h3>
        <h4>Sessions completed (${done.length} of 12)</h4><p>${done.length ? done.map(n => "Session " + n).join(" · ") : "None yet."}${typeof s.typed === "string" && s.typed && s.typed !== s.name ? ` <span class="small muted">· Name typed at sign-in: ${esc(s.typed)}</span>` : ""}</p>
        <h4>Workbook results</h4>${T(["Date", "Session", "Score", "By level", "Wrong questions"], of(D.workbooks, s.code, x).map(w => [day(w.at), w.session, w.score + " / " + w.total, String(w.levels).replace(/[{}"]/g, "").replace(/,/g, " · "), w.wrong || "none"]))}
        <h4>Every quiz attempt, with error log</h4>${T(["Date", "Session", "Attempt", "Score", "Minutes", "Blank", "Skills to review", "Error log"], of(D.quizzes, s.code, x).map(q => [day(q.at), q.session, q.attempt, q.score + " / " + q.total, q.minutes, q.blank, q.review || "", q.log || ""]))}
        <h4>Mock test results</h4>${T(["Date", "Session", "Score", "By skill", "Wrong questions", "Minutes"], of(D.mocks, s.code, x).map(m => [day(m.at), m.session, m.score + " / " + m.total, String(m.bySkill).replace(/[{}"]/g, "").replace(/\],/g, "] · "), m.wrong || "none", m.minutes]))}`;
    }).join("<hr style='border:0;border-top:1.5px dashed var(--line2);margin:14px 0'>");
  }
  /* ---------- export to spreadsheet (CSV opens in Excel and Google Sheets) ---------- */
  function summary() {
    const out = [["Name", "Access code", ...SUBJ.flatMap(x => [x + " sessions completed", x + " workbooks submitted", x + " workbook average %", x + " quiz attempts", x + " best quiz %", x + " best mock test"]), "Last sign-in"]];
    filtered().forEach(s => out.push([s.name || s.typed, s.code, ...SUBJ.flatMap(x => {
      const w = of(D.workbooks, s.code, x), q = of(D.quizzes, s.code, x), m = best(of(D.mocks, s.code, x)), bq = best(q);
      return [doneOf(s.code, x), w.length, w.length ? Math.round(w.reduce((a, b) => a + b.score / b.total, 0) / w.length * 100) : "", q.length, bq ? Math.round(bq.score / bq.total * 100) : "", m ? m.score + "/" + m.total : ""];
    }), day(s.last)]));
    return out;
  }
  function all() {
    const ok = new Set(filtered().map(s => s.code)), nm = {}, gp = {}; D.students.forEach(s => { nm[s.code] = s.name || s.typed; gp[s.code] = s.group; });
    const out = [["Type", "Date", "Name", "Access code", "Subject", "Session", "Attempt", "Score", "Total", "Percent", "Details / skills to review", "Wrong questions (error log)"]];
    const add = (type, x, att, det, wrong) => { if (ok.has(x.code)) out.push([type, day(x.at), nm[x.code], x.code, x.subject, x.session, att, x.score, x.total, x.total ? Math.round(x.score / x.total * 100) : "", det, wrong]); };
    D.workbooks.forEach(w => add("Workbook", w, "", w.levels, w.wrong));
    D.quizzes.forEach(q => add("Quiz", q, q.attempt, (q.minutes ? q.minutes + " min · " : "") + (q.blank ? q.blank + " blank · " : "") + (q.review || ""), q.log || ""));
    D.mocks.forEach(m => add("Mock test", m, "", m.bySkill, m.wrong));
    return out;
  }
  function csv(name, rowsArr) {
    /* a leading ' stops a spreadsheet from running a cell that starts with = + - @ as a formula */
    const cell = v => { let s = String(v == null ? "" : v); if (/^[=+\-@]/.test(s) && isNaN(Number(s))) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
    const blob = new Blob(["﻿" + rowsArr.map(r => r.map(cell).join(",")).join("\r\n")], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name + "-" + new Date().toISOString().slice(0, 10) + ".csv"; document.body.appendChild(a); a.click(); a.remove();
  }
  $("#out").onclick = () => { pw = ""; D = null; try { sessionStorage.removeItem("ged-teacher"); } catch (e) {} login(); };
  pw && API ? load() : login();
})();
</script>
</body>
</html>
