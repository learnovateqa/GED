<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Teacher portal · The GED Academy</title>
<meta name="theme-color" content="#DCEEF4">
<link rel="icon" href="../icons/academy.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/academy.css">
<style>
.top{background:var(--pink);border-bottom:1px solid #B9DAE5}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:62px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;margin-inline-end:auto}
.logo img{width:38px;height:38px;border-radius:11px}
.logo b{display:block;line-height:1.1}.logo small{font-size:.7rem;color:var(--ink2)}
main{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
.field{display:block;margin:10px 0}.field span{display:block;font-weight:600;font-size:.9rem;margin-bottom:4px}
.field input,.bar2 select,.bar2 input{width:100%;min-height:46px;border:1.5px solid var(--line2);border-radius:12px;padding:0 12px;background:#fff}
.bar2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:12px 0;align-items:end}
.bar2 label span{display:block;font-size:.76rem;font-weight:600;margin-bottom:2px}
.scroll{overflow-x:auto;border:1.5px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:9px 12px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--blue);position:sticky;top:0;font-size:.78rem}
tbody tr.st{cursor:pointer}tbody tr.st:hover{background:var(--soft)}
td.det{white-space:normal;background:var(--soft);padding:14px}
.det h4{margin:10px 0 4px;font-size:.92rem}.det table{font-size:.84rem;background:#fff;border:1px solid var(--line)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:12px 0}
.err{color:var(--bad);font-weight:600}
.linkb{background:none;border:0;padding:0;font-weight:600;text-decoration:underline;cursor:pointer;color:var(--navy)}
</style>
</head>
<body>
<header class="top"><div class="wrap">
 <a class="logo" href="../"><img src="../icons/academy.svg" alt=""><span><b>Teacher portal</b><small>The GED Academy · Ms. Maria</small></span></a>
 <button class="btn sm soft" id="out" type="button" hidden>Sign out</button>
</div></header>
<main id="main"></main>

<script src="../rla/config.js"></script>
<script>
(function () {
  const API = (window.CFG && CFG.API) || "", main = document.getElementById("main"), $ = s => document.querySelector(s);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const day = s => { const d = new Date(s); return isNaN(d) ? "" : d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }) + " " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }); };
  const SUBJ = ["RLA", "Social Studies"];
  let pw = "", D = null, open = "";
  try { pw = sessionStorage.getItem("ged-teacher") || ""; } catch (e) {}   /* kept only until this browser tab closes */
  const post = async body => (await fetch(API, { method: "POST", body: JSON.stringify(Object.assign({ password: pw }, body)) })).json();
  const MSG = { wrong: "This password is not correct.", locked: "Too many wrong tries. Wait 10 minutes and try again.", nopassword: "No teacher password is set yet. In your Google Sheet, use the menu GED Academy > Set teacher password." };

  function login(msg) {
    $("#out").hidden = true;
    if (!API) { main.innerHTML = `<div class="card t-gold" style="background:var(--c);max-width:560px;margin:6vh auto"><h1 style="font-size:1.4rem">The grade book is not connected yet</h1><p>The portal shows data from your Google Sheet. Follow the set-up steps in the README (section “Grade book”), then give the Web app URL to Claude.</p><a class="btn soft" href="../">Back to the site</a></div>`; return; }
    main.innerHTML = `<div class="card t-rose" style="background:var(--c);max-width:460px;margin:6vh auto"><p class="eyebrow">🔒 Teacher only</p><h1 style="font-size:1.5rem">Teacher portal</h1>
      <form id="f"><label class="field"><span>Password</span><input type="password" name="p" required autocomplete="current-password"></label>
      <p class="err" role="alert" id="e">${esc(msg || "")}</p><button class="btn primary" style="width:100%" type="submit">Sign in</button></form>
      <p class="small muted" style="margin-top:10px">The password is checked by your Google Sheet. It is not stored on this website.</p></div>`;
    $("#f").onsubmit = async ev => { ev.preventDefault(); pw = ev.target.p.value; const b = ev.target.querySelector("button"); b.disabled = true; b.innerHTML = '<span class="wait">Checking…</span>'; await load(); };
  }
  async function load() {
    try {
      const r = await post({ action: "teacher" });
      if (!r.ok) { pw = ""; try { sessionStorage.removeItem("ged-teacher"); } catch (e) {} return login(MSG[r.error] || "Something went wrong. Please try again."); }
      try { sessionStorage.setItem("ged-teacher", pw); } catch (e) {}
      D = r; draw();
    } catch (e) { login("No internet, or the grade book did not answer."); }
  }
  const of = (list, code, subj) => list.filter(x => x.code === code && (!subj || x.subject === subj));
  const doneOf = (code, subj) => { const p = D.progress.find(x => x.code === code && x.subject === subj); return p ? Number(p.done) || 0 : 0; };
  const best = xs => xs.length ? xs.reduce((a, b) => (b.score / b.total > a.score / a.total ? b : a)) : null;

  function draw() {
    $("#out").hidden = false;
    const groups = [...new Set(D.students.map(s => s.group).filter(Boolean))].sort();
    main.innerHTML = `<h1>Students</h1>
      <div class="kpi">
        <div class="pillar t-blue"><small>STUDENTS</small><b>${D.students.length}</b></div>
        <div class="pillar t-green"><small>WORKBOOKS SUBMITTED</small><b>${D.workbooks.length}</b></div>
        <div class="pillar t-peach"><small>QUIZ ATTEMPTS</small><b>${D.quizzes.length}</b></div>
        <div class="pillar t-lav"><small>MOCK TESTS</small><b>${D.mocks.length}</b></div>
      </div>
      <div class="bar2">
        <label><span>Group</span><select id="g"><option value="">All groups</option>${groups.map(g => `<option>${esc(g)}</option>`).join("")}</select></label>
        <label><span>Subject</span><select id="s"><option value="">Both subjects</option>${SUBJ.map(g => `<option>${esc(g)}</option>`).join("")}</select></label>
        <label><span>Find a student</span><input id="q" type="search" placeholder="Name or code"></label>
        <button class="btn primary" type="button" id="xs">Export summary</button>
        <button class="btn" type="button" id="xa">Export all results</button>
      </div>
      <div class="scroll"><table><thead id="th"></thead><tbody id="tb"></tbody></table></div>
      <p class="small muted" style="margin-top:8px">Tap a student to see every workbook, quiz attempt and mock test. The export files open in Excel or Google Sheets.</p>
      <div class="sh"><span class="no">+</span><h2>Quiz answer keys</h2></div>
      <p>Keys loaded in the grade book: <b>${D.keys.length ? esc(D.keys.join(", ")) : "none yet"}</b>. Students cannot take a quiz until its key is loaded.</p>
      <label class="btn soft" style="cursor:pointer">Import quiz answer keys (quiz-keys.json)<input type="file" id="kf" accept=".json,application/json" hidden></label> <span id="km" role="status"></span>
      <p class="small muted" style="margin-top:8px">To add, remove or change students and groups, edit the Students tab in your Google Sheet.</p>`;
    ["g", "s", "q"].forEach(id => $("#" + id).oninput = rows);
    $("#xs").onclick = () => csv("ged-summary", summary());
    $("#xa").onclick = () => csv("ged-all-results", all());
    $("#kf").onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      try { const keys = JSON.parse(await f.text()); $("#km").textContent = "Saving…"; const r = await post({ action: "keys", keys }); if (!r.ok) throw 0; await load(); alert(r.saved + " answer key(s) saved in the grade book."); }
      catch (err) { $("#km").textContent = "This file did not work. Choose quiz-keys.json."; }
    };
    rows();
  }
  function filtered() {
    const g = $("#g").value, q = $("#q").value.trim().toLowerCase();
    return D.students.filter(s => (!g || s.group === g) && (!q || (s.name + " " + s.code + " " + s.typed).toLowerCase().includes(q)));
  }
  function rows() {
    const subj = $("#s").value, S = subj ? [subj] : SUBJ;
    $("#th").innerHTML = `<tr><th>Student</th><th>Group</th>${S.map(x => `<th>${esc(x)}<br>sessions done</th><th>${esc(x)}<br>workbooks</th><th>${esc(x)}<br>quiz attempts</th><th>${esc(x)}<br>mock tests</th>`).join("")}<th>Last sign-in</th></tr>`;
    const list = filtered();
    $("#tb").innerHTML = list.length ? list.map(s => {
      const cells = S.map(x => { const m = best(of(D.mocks, s.code, x)); return `<td><b>${doneOf(s.code, x)}</b> / 12</td><td>${of(D.workbooks, s.code, x).length}</td><td>${of(D.quizzes, s.code, x).length}</td><td>${m ? m.score + "/" + m.total : "–"}</td>`; }).join("");
      return `<tr class="st" data-c="${esc(s.code)}" tabindex="0"><td><b>${esc(s.name || s.typed)}</b>${s.active ? "" : " (not active)"}<br><span class="small muted">${esc(s.code)}</span></td><td>${esc(s.group)}</td>${cells}<td>${esc(day(s.last))}</td></tr>${open === s.code ? `<tr><td class="det" colspan="${3 + S.length * 4}">${detail(s, S)}</td></tr>` : ""}`;
    }).join("") : `<tr><td colspan="12">No students match. Add students in the Students tab of your Google Sheet.</td></tr>`;
    document.querySelectorAll("tr.st").forEach(tr => { const go = () => { open = open === tr.dataset.c ? "" : tr.dataset.c; rows(); }; tr.onclick = go; tr.onkeydown = e => { if (e.key === "Enter") go(); }; });
  }
  function detail(s, S) {
    const T = (head, body) => body.length ? `<div class="scroll"><table><thead><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${body.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>` : `<p class="small muted">Nothing yet.</p>`;
    return S.map(x => {
      const p = D.progress.find(y => y.code === s.code && y.subject === x), st = (p && p.state && p.state.s) || {};
      const done = Object.keys(st).filter(n => st[n].badge).sort((a, b) => a - b);
      return `<h3>${esc(x)}</h3>
        <h4>Sessions completed (${done.length} of 12)</h4><p>${done.length ? done.map(n => "Session " + n).join(" · ") : "None yet."}${typeof s.typed === "string" && s.typed && s.typed !== s.name ? ` <span class="small muted">· Name typed at sign-in: ${esc(s.typed)}</span>` : ""}</p>
        <h4>Workbook results</h4>${T(["Date", "Session", "Score", "By level", "Wrong questions"], of(D.workbooks, s.code, x).map(w => [day(w.at), w.session, w.score + " / " + w.total, String(w.levels).replace(/[{}"]/g, "").replace(/,/g, " · "), w.wrong || "none"]))}
        <h4>Every quiz attempt</h4>${T(["Date", "Session", "Attempt", "Score"], of(D.quizzes, s.code, x).map(q => [day(q.at), q.session, q.attempt, q.score + " / " + q.total]))}
        <h4>Mock test results</h4>${T(["Date", "Session", "Score", "By skill", "Wrong questions", "Minutes"], of(D.mocks, s.code, x).map(m => [day(m.at), m.session, m.score + " / " + m.total, String(m.bySkill).replace(/[{}"]/g, "").replace(/\],/g, "] · "), m.wrong || "none", m.minutes]))}`;
    }).join("<hr style='border:0;border-top:1.5px dashed var(--line2);margin:14px 0'>");
  }
  /* ---------- export to spreadsheet (CSV opens in Excel and Google Sheets) ---------- */
  function summary() {
    const out = [["Name", "Access code", "Group", ...SUBJ.flatMap(x => [x + " sessions completed", x + " workbooks submitted", x + " workbook average %", x + " quiz attempts", x + " best quiz %", x + " best mock test"]), "Last sign-in"]];
    filtered().forEach(s => out.push([s.name || s.typed, s.code, s.group, ...SUBJ.flatMap(x => {
      const w = of(D.workbooks, s.code, x), q = of(D.quizzes, s.code, x), m = best(of(D.mocks, s.code, x)), bq = best(q);
      return [doneOf(s.code, x), w.length, w.length ? Math.round(w.reduce((a, b) => a + b.score / b.total, 0) / w.length * 100) : "", q.length, bq ? Math.round(bq.score / bq.total * 100) : "", m ? m.score + "/" + m.total : ""];
    }), day(s.last)]));
    return out;
  }
  function all() {
    const ok = new Set(filtered().map(s => s.code)), nm = {}, gp = {}; D.students.forEach(s => { nm[s.code] = s.name || s.typed; gp[s.code] = s.group; });
    const out = [["Type", "Date", "Name", "Access code", "Group", "Subject", "Session", "Attempt", "Score", "Total", "Percent", "Details", "Wrong questions"]];
    const add = (type, x, att, det, wrong) => { if (ok.has(x.code)) out.push([type, day(x.at), nm[x.code], x.code, gp[x.code], x.subject, x.session, att, x.score, x.total, x.total ? Math.round(x.score / x.total * 100) : "", det, wrong]); };
    D.workbooks.forEach(w => add("Workbook", w, "", w.levels, w.wrong));
    D.quizzes.forEach(q => add("Quiz", q, q.attempt, "", ""));
    D.mocks.forEach(m => add("Mock test", m, "", m.bySkill, m.wrong));
    return out;
  }
  function csv(name, rowsArr) {
    /* a leading ' stops a spreadsheet from running a cell that starts with = + - @ as a formula */
    const cell = v => { let s = String(v == null ? "" : v); if (/^[=+\-@]/.test(s) && isNaN(Number(s))) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
    const blob = new Blob(["﻿" + rowsArr.map(r => r.map(cell).join(",")).join("\r\n")], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name + "-" + new Date().toISOString().slice(0, 10) + ".csv"; document.body.appendChild(a); a.click(); a.remove();
  }
  $("#out").onclick = () => { pw = ""; D = null; try { sessionStorage.removeItem("ged-teacher"); } catch (e) {} login(); };
  pw && API ? load() : login();
})();
</script>
</body>
</html>
